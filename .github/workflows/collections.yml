name: Collections

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  collect:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-gcc-x64
            runner: ubuntu-24.04
            configure: -DCMAKE_C_COMPILER=gcc -DCMAKE_CXX_COMPILER=g++
          - name: linux-clang-x64
            runner: ubuntu-24.04
            configure: -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++
          - name: macos-arm64
            runner: macos-15
            configure: -DCMAKE_OSX_ARCHITECTURES=arm64
          - name: windows-x64
            runner: windows-2022
            configure: -G "Visual Studio 17 2022" -A x64
          - name: windows-x86
            runner: windows-2022
            configure: -G "Visual Studio 17 2022" -A Win32
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Record run inventory
        env:
          RUN_NAME: ${{ matrix.name }}
          RUN_COUNT: ${{ strategy.job-total }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          name = os.environ["RUN_NAME"]
          directory = Path("results")
          directory.mkdir()
          (directory / ("run-" + name + ".json")).write_text(json.dumps({
              "schema_version": 1, "name": name, "commit": os.environ["GITHUB_SHA"],
              "expected_runs": int(os.environ["RUN_COUNT"]), "measurements": "results-" + name,
          }) + "\n")
          PY
      - name: Initialize dependencies
        run: git -c core.longpaths=true submodule update --init --depth 1 --jobs 3
      - name: Check dependency checkout
        env:
          RUN_NAME: ${{ matrix.name }}
        run: |
          python - <<'PY'
          import os, sys
          from pathlib import Path
          sys.path.insert(0, "scripts")
          from run import check_dependencies
          check_dependencies(Path("results") / ("dependencies-" + os.environ["RUN_NAME"] + ".json"))
          PY
      - name: Build collection targets
        run: |
          cmake -S . -B build/release -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_TESTING=OFF ${{ matrix.configure }}
          cmake --build build/release --config Release --parallel 4
      - name: Collect CPU and memory results
        run: python scripts/run.py --build build/release --output results/results-${{ matrix.name }}
      - name: Publish platform summary
        run: cat results/results-${{ matrix.name }}/summary.md >> "$GITHUB_STEP_SUMMARY"
      - name: Upload measurements
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: results-${{ matrix.name }}
          path: results/*
          overwrite: true
          retention-days: 14

  report:
    name: Combined report
    needs: collect
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Download measurements
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: results-*
          path: build/artifacts
          merge-multiple: true
      - name: Generate combined report
        if: always()
        env:
          COLLECTION_STATUS: ${{ needs.collect.result }}
        run: |
          python scripts/ci_report.py build/artifacts --commit "$GITHUB_SHA" \
            --collection-status "$COLLECTION_STATUS"
      - name: Upload combined results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: collection-results
          path: build/artifacts
          if-no-files-found: error
          overwrite: true
          retention-days: 14
      - name: Stage GitHub Pages site
        if: success() && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: python scripts/ci_report.py build/artifacts --commit "$GITHUB_SHA" --site build/pages
      - name: Upload GitHub Pages site
        if: success() && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: build/pages

  deploy:
    name: Publish report
    needs: [collect, report]
    if: >-
      github.ref == 'refs/heads/main' && github.event_name != 'pull_request' &&
      needs.collect.result == 'success' && needs.report.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages site
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
